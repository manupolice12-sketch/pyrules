[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrules"
version = "0.1.0"
description = "A lightweight gameplay scripting language and runtime for Python games."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
authors = [{ name = "Aman Ashik" }]
dependencies = []

[tool.setuptools]
package-dir = {"pyrules" = "pyrules_runtime/src"}

[tool.setuptools.packages.find]
where = ["pyrules_runtime/src"]